services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      SITE_SELECTION_RUNTIME_MODE: fixture
      SITE_SELECTION_RUN_MODE: async
      SITE_SELECTION_REPORT_DIR: /app/artifacts/reports
      SITE_SELECTION_REDIS_NAMESPACE: site_selection:fixture
      SITE_SELECTION_QUEUE_NAME: ${SITE_SELECTION_QUEUE_NAME:-site-selection}
      SITE_SELECTION_JOB_TIMEOUT_SECONDS: ${SITE_SELECTION_JOB_TIMEOUT_SECONDS:-180}
      SITE_SELECTION_JOB_RESULT_TTL_SECONDS: ${SITE_SELECTION_JOB_RESULT_TTL_SECONDS:-3600}
      SITE_SELECTION_JOB_FAILURE_TTL_SECONDS: ${SITE_SELECTION_JOB_FAILURE_TTL_SECONDS:-86400}
      SITE_SELECTION_RUN_TTL_SECONDS: ${SITE_SELECTION_RUN_TTL_SECONDS:-86400}
      SITE_SELECTION_IDEMPOTENCY_TTL_SECONDS: ${SITE_SELECTION_IDEMPOTENCY_TTL_SECONDS:-86400}
      SITE_SELECTION_POI_CACHE_TTL_SECONDS: ${SITE_SELECTION_POI_CACHE_TTL_SECONDS:-3600}
      SITE_SELECTION_EVENT_TTL_SECONDS: ${SITE_SELECTION_EVENT_TTL_SECONDS:-86400}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in .env}
      LLM_BASE_URL: ${LLM_BASE_URL:?Set LLM_BASE_URL in .env}
      LLM_MODEL: ${LLM_MODEL:?Set LLM_MODEL in .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgis:5432/${POSTGRES_DB:-site_selection}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - report_artifacts:/app/artifacts/reports
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - scripts/run_site_selection_worker.py
    environment:
      SITE_SELECTION_RUNTIME_MODE: fixture
      SITE_SELECTION_RUN_MODE: sync
      SITE_SELECTION_REPORT_DIR: /app/artifacts/reports
      SITE_SELECTION_REDIS_NAMESPACE: site_selection:fixture
      SITE_SELECTION_QUEUE_NAME: ${SITE_SELECTION_QUEUE_NAME:-site-selection}
      SITE_SELECTION_RUN_TTL_SECONDS: ${SITE_SELECTION_RUN_TTL_SECONDS:-86400}
      SITE_SELECTION_IDEMPOTENCY_TTL_SECONDS: ${SITE_SELECTION_IDEMPOTENCY_TTL_SECONDS:-86400}
      SITE_SELECTION_POI_CACHE_TTL_SECONDS: ${SITE_SELECTION_POI_CACHE_TTL_SECONDS:-3600}
      SITE_SELECTION_EVENT_TTL_SECONDS: ${SITE_SELECTION_EVENT_TTL_SECONDS:-86400}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in .env}
      LLM_BASE_URL: ${LLM_BASE_URL:?Set LLM_BASE_URL in .env}
      LLM_MODEL: ${LLM_MODEL:?Set LLM_MODEL in .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgis:5432/${POSTGRES_DB:-site_selection}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
    volumes:
      - report_artifacts:/app/artifacts/reports
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - scripts/run_fixture_mcp_server.py
    environment:
      SITE_SELECTION_RUNTIME_MODE: fixture
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgis:5432/${POSTGRES_DB:-site_selection}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
    ports:
      - "${MCP_PORT:-8001}:8001"
    depends_on:
      api:
        condition: service_healthy

  workbench:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - streamlit
      - run
      - workbench/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    environment:
      SITE_SELECTION_API_URL: http://api:8000
      SITE_SELECTION_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WORKBENCH_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy

  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-site_selection}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgis_data:
  redis_data:
  report_artifacts:
